<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Crossings</title>
    <link rel="stylesheet" href="arquivos/style.css">
    <script src="arquivos/script.js" type="module"></script>
    <link rel="shortcut icon" href="arquivos/imagens/favicon.ico" type="image/x-icon">

    <!-- Google fonts Merriweather -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prata&display=swap" rel="stylesheet">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>

    <header>
        <div>
            <a href="https://www.globalcrossings.com.br/">
                <img src="arquivos/logo.png" alt="Logo do site">
            </a>
        </div>
        <nav class="nav-menu">

            <div class="menu-toggle" id="menuToggle">
                <i class="bi bi-list"></i>
            </div>

            <ul id="navMenuList">
                <li><a href="https://www.globalcrossings.com.br/">Home</a></li>
                <li><a href="https://www.globalcrossings.com.br/institucional/">Institucional</a></li>
                <li><a href="https://www.globalcrossings.com.br/revista/index.php/gc">Revista</a></li>
                <li><a href="https://www.globalcrossings.com.br/newsletter/">Newsletter</a></li>

                <li class="dropdown">
                    <a href="https://www.globalcrossings.com.br/grupos-2/" class="active">Grupos de pesquisa ▼</a>
                    <ul class="submenu">
                        <li>
                            <a href="https://www.globalcrossings.com.br/oieods/">OIEODS/UFO</a>
                        </li>
                        <li>
                            <a href="https://www.globalcrossings.com.br/bbdh/">
                                BBDH/UFU
                            </a>
                        </li>
                        <li>
                            <a href="https://www.globalcrossings.com.br/clinica/">HUMANITAS/UFU</a>
                        </li>
                    </ul>
                </li>

                <li><a href="https://www.globalcrossings.com.br/editais/">Editais</a></li>
                <li><a href="https://www.globalcrossings.com.br/eventos/">Eventos</a></li>
                <li><a href="https://www.globalcrossings.com.br/noticias-2/">notícias</a></li>
                <li><a href="https://www.globalcrossings.com.br/publicacoes/">Publicações</a></li>
                <li><a href="https://www.globalcrossings.com.br/contato/">Contato</a></li>
                <li><a href="index.html">Cursos</a></li>
            </ul>
        </nav>
    </header>

    <main class="curso-main">

        <div class="navegador-curso">
            <button id="toc-toggle">☰</button>
            <span id="navegadorNome"></span>
            <nav class="curso-nav-menu" id="toc"></nav>
        </div>

        <article>

            <!-- SEÇÃO 1 -->
            <h1 id="titulo"></h1>

            <div class="curso-capa">
                <img src="" alt="" id="capaCurso">
            </div>

            <p class="curso-date" id="dataCurso"></p>

            <!--<div class="curso-video-container">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ?si=HupyFK9W2vJbfuqf"
                    title="YouTube video player" frameborder="0" referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>

                <p>Video by <a href="https://www.youtube.com/@TheProblem" target="_blank">The Problem</a></p>
            </div>-->

            <div id="conteudoCurso"></div>

            <div class="botao-quiz-container">
                <button class="btn-quiz" id="abrirQuiz">
                    <span class="mascote">🧑‍⚕️</span>
                    <span class="texto">
                        Fazer quiz final
                        <small>Testar meus conhecimentos e receber o certificado</small>
                    </span>
                </button>
            </div>
        </article>

        <!-- SEÇÃO DE PRODUÇÃO DO CURSO -->
        <div class="curso-producao-container">
            <h2 style="text-align: center;">Ficha Técnica</h2>
            <div class="curso-producao">
                <div class="curso-producao-imagem">
                    <img src="" alt="" id="producaoCurso">
                </div>
                <div class="curso-producao-esquerda" id="producaoCursoEsquerda">
                </div>
                <div class="curso-producao-direita" id="producaoCursoDireita">
                </div>
            </div>
        </div>

        <div class="modal-quiz" id="modalQuiz">
            <div class="modal-conteudo">
                <button class="fechar" id="fecharQuiz">×</button>

                <div class="cabecalho">
                    <h1 style="color: white;">🧑‍⚕️Quiz final</h1>
                    <p>Responda e receba seu resultado</p>
                </div>

                <div class="area-form">
                    <iframe id="formQuiz" src="" loading="lazy">
                    </iframe>
                </div>
            </div>
        </div>

    </main>

    <footer>
        @2026 <a href="https://devdanifibra.vercel.app" target="_blank">devdanifibra</a>
    </footer>

</html>
